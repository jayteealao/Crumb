pluginManagement {
    includeBuild("plugins")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
            content {
                // coil-transformations is not published on Maven Central; restrict JitPack
                // to only resolve this specific artifact group to limit supply-chain exposure.
                includeGroup "com.github.Commit451.coil-transformations"
            }
        }
    }
}
rootProject.name = "Crumbs"
include ':app'
include ':feature:reddit'
//include ':plugins'
include ':feature:twitter'
include ':core:pref'
include ':core:models'
include ':core:designsystem'
include ':core:data'
