# Robolectric configuration for :app unit tests.
# Boots a test Application that initializes a dummy FirebaseApp before
# CrumbApplication.onCreate() resolves Firebase-backed Hilt bindings, so
# Robolectric tests that use the real app graph do not crash on startup.
application=com.github.jayteealao.crumbs.CrumbRobolectricTestApplication
sdk=34
