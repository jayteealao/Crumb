plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'project-report'
    id 'io.github.takahirom.roborazzi' version '1.60.0'
//    id 'org.jmailen.kotlinter'
}

android {
    namespace 'com.github.jayteealao.crumbs'
    compileSdk 35

    signingConfigs {
        release {
            def storeFilePath = System.getenv("SIGNING_STORE_FILE")
            if (storeFilePath != null) {
                storeFile file(storeFilePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.github.jayteealao.crumbs"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Web OAuth client ID consumed by Credential Manager (GetSignInWithGoogleOption).
        // Sourced from FIREBASE_WEB_OAUTH_CLIENT_ID env var or local.properties so
        // we never commit the literal. Empty in CI causes a NoCredentialException
        // at sign-in time, surfaced to the UI as a network-class error.
        def webOauthClientId = System.getenv("FIREBASE_WEB_OAUTH_CLIENT_ID")
        if (webOauthClientId == null || webOauthClientId.isEmpty()) {
            def localProps = new Properties()
            def localPropsFile = rootProject.file("local.properties")
            if (localPropsFile.exists()) {
                localPropsFile.withInputStream { localProps.load(it) }
                webOauthClientId = localProps.getProperty("firebase.webOauthClientId", "")
            }
        }
        buildConfigField "String", "WEB_OAUTH_CLIENT_ID", "\"${webOauthClientId ?: ''}\""
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    sourceSets {
        androidTest {
            assets {
                srcDirs("$projectDir/schemas")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("SIGNING_STORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (System.getenv("SIGNING_STORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

