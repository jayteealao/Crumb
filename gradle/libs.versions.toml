[versions]
composeBom = "2026.05.00"
coroutines = "1.5.2"
coroutinesTest = "1.10.2"
roborazzi = "1.60.0"
robolectric = "4.16"
kotlinxCollectionsImmutable = "0.3.8"
accompanist = "0.22.0-rc"
arrow = "1.1.4-alpha.10"
lifecycle = "2.6.0-alpha01"
retrofit = "2.9.0"
room = "2.8.4"
firebase-bom = "34.13.0"
androidxCredentials = "1.6.0"
androidxBrowser = "1.8.0"
googleid = "1.1.1"
hilt = "2.59.2"
coil = "2.5.0"
coilTransformations = "2.0.2"
media3 = "1.2.0"

[libraries]
#compose BOM (governs all androidx.compose.* artifacts below)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
#androidx
androidx-core = {module = "androidx.core:core-ktx", version = "1.9.0"}
androidx-lifecycle = {module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.5.1"}
#compose (versions governed by composeBom)
compose-ui = {module = "androidx.compose.ui:ui"}
compose-uiTooling = {module = "androidx.compose.ui:ui-tooling-preview"}
compose-uiToolingDebug = {module = "androidx.compose.ui:ui-tooling"}
compose-uiTestJunit4 = {module = "androidx.compose.ui:ui-test-junit4"}
compose-uiTestManifest = {module = "androidx.compose.ui:ui-test-manifest"}
compose-material = {module = "androidx.compose.material:material"}
compose-material3 = {module = "androidx.compose.material3:material3"}
compose-materialIcons = {module = "androidx.compose.material:material-icons-core"}
compose-materialIconsExt = {module = "androidx.compose.material:material-icons-extended"}
compose-foundation = {module = "androidx.compose.foundation:foundation"}
compose-runtime = {module = "androidx.compose.runtime:runtime-livedata"}
#compose-interop
activityCompose = {module = "androidx.activity:activity-compose", version = "1.8.2"}
lifecycleViewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.5.1"}
lifecycleRuntimeCompose = {module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.6.0-alpha03"}
hiltNavigationCompose = {module = "androidx.hilt:hilt-navigation-compose", version = "1.0.0"}
navigationCompose = {module = "androidx.navigation:navigation-compose", version = "2.5.3"}
pagingCompose = {module = "androidx.paging:paging-compose", version = "3.3.6"}
#retrofit
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
retrofit-sandwich = { module = "com.github.skydoves:sandwich", version = "1.3.1" }
#room
room-runtime = {module = "androidx.room:room-runtime", version.ref = "room"}
room-compiler = {module = "androidx.room:room-compiler", version.ref = "room"}
room-ktx = {module = "androidx.room:room-ktx", version.ref = "room"}
room-paging = {module = "androidx.room:room-paging", version.ref = "room"}
room-testing = {module = "androidx.room:room-testing", version.ref = "room"}
#kotlinx
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
#timber
timber = {module = "com.jakewharton.timber:timber", version = "5.0.1"}
#roborazzi
roborazzi-core = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
#firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-functions = { module = "com.google.firebase:firebase-functions" }
#browser (Chrome Custom Tabs)
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
#credentials (Credential Manager + Google Identity)
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
#hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
#arrow
arrow-optics = { module = "io.arrow-kt:arrow-optics", version.ref = "arrow" }
#coil
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-transformations = { module = "com.github.Commit451.coil-transformations:transformations", version.ref = "coilTransformations" }
coil-transformations-gpu = { module = "com.github.Commit451.coil-transformations:transformations-gpu", version.ref = "coilTransformations" }
#media3
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
[bundles]
androidx = ['androidx-core', 'androidx-lifecycle']
compose = ['compose-ui', 'compose-uiTooling', 'compose-foundation', 'compose-material', 'compose-materialIcons', 'compose-materialIconsExt', 'compose-runtime']
composeInterop = ['activityCompose', 'lifecycleRuntimeCompose', 'lifecycleViewmodelCompose', 'hiltNavigationCompose', 'navigationCompose', 'pagingCompose']
retrofit = ['retrofit-core', 'retrofit-gson', 'retrofit-sandwich']
room = ['room-runtime', 'room-ktx', 'room-paging']
