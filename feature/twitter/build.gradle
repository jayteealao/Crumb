plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'io.github.takahirom.roborazzi' version '1.60.0'
}

def twitterLocalProps = new Properties()
def twitterLocalFile = rootProject.file('local.properties')
if (twitterLocalFile.exists()) {
    twitterLocalProps.load(twitterLocalFile.newReader())
}
def twitterClientId = twitterLocalProps.getProperty('twitter.clientId', '')
def twitterClientSecret = twitterLocalProps.getProperty('twitter.clientSecret', '')

android {
    namespace 'com.github.jayteealao.twitter'
    compileSdk 35

    defaultConfig {
//        applicationId "com.github.jayteealao.twitter"
        minSdk 24
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TWITTER_CLIENT_ID", "\"${twitterClientId}\""
        buildConfigField "String", "TWITTER_CLIENT_SECRET", "\"${twitterClientSecret}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {

    implementation(project(":core:pref"))
    implementation(project(":core:models"))
    implementation(project(":core:designsystem"))
    implementation(project(":core:data"))

    implementation(platform(libs.compose.bom))
    implementation(libs.bundles.androidx)
    implementation(libs.bundles.composeInterop)
    implementation(libs.bundles.compose)
    implementation(libs.compose.material3)
//    room
    implementation(libs.bundles.room)
    ksp(libs.room.compiler)

//    hilt
    implementation(libs.hilt.android)
    ksp(libs.hilt.compiler)

//    retrofit
    implementation(libs.bundles.retrofit)

//    datastore
//    implementation "androidx.datastore:datastore-preferences:1.0.0"

//    coil
    implementation("io.coil-kt:coil-compose:2.2.2")
    implementation "com.github.Commit451.coil-transformations:transformations:2.0.2"
    implementation "com.github.Commit451.coil-transformations:transformations-gpu:2.0.2"

//    timber
    implementation(libs.timber)

//    firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.firestore

//    arrow-optics
    implementation(libs.arrow.optics)

//    media3-exoplayer
    implementation("androidx.media3:media3-exoplayer:1.0.0-beta02")
    implementation("androidx.media3:media3-ui:1.0.0-beta02")

//    chrome custom tabs
//    implementation "androidx.browser:browser:1.4.0"

    testImplementation 'junit:junit:4.13.2'
    testImplementation(libs.roborazzi.core)
    testImplementation(libs.roborazzi.compose)
    testImplementation(libs.roborazzi.junit.rule)
    testImplementation(libs.robolectric)
    testImplementation(platform(libs.compose.bom))
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.activity:activity-compose:1.8.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'
    androidTestImplementation(platform(libs.compose.bom))
    androidTestImplementation(libs.compose.uiTestJunit4)
    debugImplementation(platform(libs.compose.bom))
    debugImplementation(libs.compose.uiToolingDebug)
    debugImplementation(libs.compose.uiTestManifest)
}