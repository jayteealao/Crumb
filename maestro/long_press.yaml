# Focused long-press popup verification — 4 actions + backdrop dismiss.
appId: com.github.jayteealao.crumbs
---
- launchApp:
    arguments:
      debug_action: "seed"
      wipe: true
- runFlow:
    when:
      visible:
        id: "login-screen"
    commands:
      - tapOn:
          id: "login-skip-auth"
- extendedWaitUntil:
    visible:
      id: "home-scaffold"
    timeout: 10000
- tapOn:
    id: "nav-tab-all"
- extendedWaitUntil:
    visible:
      id: "all-bookmarks-feed"
    timeout: 5000

# --- TAG action ---
- longPressOn:
    id: "bookmark-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "popup"
    timeout: 3000
- tapOn:
    id: "popup-action-tag"
- back

# --- OPEN action ---
- longPressOn:
    id: "bookmark-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "popup"
    timeout: 3000
- tapOn:
    id: "popup-action-open"
- back

# --- SHARE action ---
- longPressOn:
    id: "bookmark-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "popup"
    timeout: 3000
- tapOn:
    id: "popup-action-share"
- back

# --- DELETE action shows snackbar ---
- longPressOn:
    id: "bookmark-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "popup"
    timeout: 3000
- tapOn:
    id: "popup-action-delete"
- extendedWaitUntil:
    visible:
      id: "snackbar"
    timeout: 3000
- tapOn:
    id: "snackbar-action"

# --- Backdrop dismiss ---
- longPressOn:
    id: "bookmark-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "popup"
    timeout: 3000
- tapOn:
    point: "50%,5%"
- assertNotVisible:
    id: "popup"
