# Filter behavior — Type instant chip, Tags chip (hedged — see Blocker 1),
# Collection chip (hedged), backdrop dismiss on overlay shell.
appId: com.github.jayteealao.crumbs
---
- launchApp:
    arguments:
      debug_action: "seed"
      wipe: true
- runFlow:
    when:
      visible:
        id: "login-screen"
    commands:
      - tapOn:
          id: "login-skip-auth"
- extendedWaitUntil:
    visible:
      id: "home-scaffold"
    timeout: 10000
- tapOn:
    id: "nav-tab-all"
- extendedWaitUntil:
    visible:
      id: "all-bookmarks-feed"
    timeout: 5000

# --- Type filter chip is instant (no overlay) ---
- tapOn:
    id: "filter-bar-chip-article"
- assertVisible:
    id: "filter-bar-chip-article"
- tapOn:
    id: "filter-bar-chip-article"

# --- Tags chip — Blocker 1: overlay UI deferred per behaviors AC-line-96.
# Assert chip toggles state only. Expand to multi-select + APPLY once
# the OverlayShell tag picker lands (Path B per plan).
- tapOn:
    id: "filter-bar-chip-tags"
- assertVisible:
    id: "filter-bar-chip-tags"

# --- Collection chip — same hedge ---
- tapOn:
    id: "filter-bar-chip-collection"
- assertVisible:
    id: "filter-bar-chip-collection"

# --- Backdrop dismiss on overlay shell (when an overlay is open) ---
- runFlow:
    when:
      visible:
        id: "overlay-shell"
    commands:
      - tapOn:
          id: "overlay-shell-backdrop"
      - assertNotVisible:
          id: "overlay-shell"
