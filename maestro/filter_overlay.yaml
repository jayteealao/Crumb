# Filter behavior — Type instant chip, Tags chip (hedged — see Blocker 1),
# Collection chip (hedged), backdrop dismiss on overlay shell.
appId: com.github.jayteealao.crumbs
---
- launchApp:
    arguments:
      debug_action: "seed"
      wipe: true
- runFlow:
    when:
      visible:
        id: "login-screen"
    commands:
      - tapOn:
          id: "login-skip-auth"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000
- tapOn:
    id: "nav-tab-all"
- extendedWaitUntil:
    visible:
      id: "all-bookmarks-feed"
    timeout: 5000

# --- Type filter chips render in main tree — testTag selectors work here ---
- tapOn:
    id: "filter-bar-chip-article"
- assertVisible:
    id: "filter-bar-chip-article"
- tapOn:
    id: "filter-bar-chip-all"
- assertVisible:
    id: "filter-bar-chip-all"

# --- Tags + Collection chips deferred per Blocker 1 (behaviors AC-line-96 OverlayShell tag picker gap).
# When the Tags overlay UI lands, assertions expand to: tapOn tags-chip → assert overlay-shell visible
# → tapOn tag list items → tapOn overlay-shell-apply → assert filter applied.
- tapOn:
    id: "filter-bar-chip-video"
- assertVisible:
    id: "filter-bar-chip-video"

# --- Backdrop dismiss on overlay shell (when an overlay is open) ---
# Overlay also uses Popup-style rendering; gated by future overlay UI delivery.
- runFlow:
    when:
      visible:
        id: "overlay-shell"
    commands:
      - tapOn:
          id: "overlay-shell-backdrop"
      - assertNotVisible:
          id: "overlay-shell"
