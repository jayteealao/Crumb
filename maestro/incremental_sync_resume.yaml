# AC5 + AC6 — resume from cursor + background continuation.
#
# Pre-seeds a sync_progress row at batch K=3 so the next worker invocation
# logs `resumed_from_cursor batchIdx=3` (captured via lazylogcat by
# scripts/run-maestro.ps1). After a pull-to-refresh gesture the app is
# backgrounded for 60 s; the WorkManager worker keeps running, and on
# foreground the feed reflects new inserts written during the background
# window.
appId: com.github.jayteealao.crumbs
---
- launchApp:
    clearState: true
    arguments:
      debug_action: "seed_partial_sync_progress"
      batch_k: "3"
- extendedWaitUntil:
    visible:
      id: "twitter-bookmarks-screen"
    timeout: 15000
# Trigger a refresh — the worker enqueue path advances batchIdx >= 4 from
# the pre-seeded cursor (proof captured in lazylogcat).
- swipe:
    start: 50%, 25%
    end: 50%, 80%
# Background and let the worker drain in the background.
- pressKey: HOME
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: HOME
- launchApp
- extendedWaitUntil:
    visible:
      id: "twitter-bookmarks-screen"
    timeout: 15000
- assertVisible:
    id: "bookmark-card"
    index: 0
