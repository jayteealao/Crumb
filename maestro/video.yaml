# Inline video — seed the debug corpus (incl. a video + an animated_gif VIDEO tweet),
# narrow to the VIDEO type chip, then exercise the inline player: the poster + play badge
# render, tapping plays inline with the brutalist controls, and the expand affordance opens
# the full-screen viewer. System Back returns to the feed.
#
# NOTE: the bookmark-card surfaces render only on an authenticated/synced feed (the
# !uiState.loggedIn server-auth gate), so this flow is a device-fidelity gate run with a
# linked X session — the off-device contract is covered by CrumbsVideoPlayerTest +
# ToBookmarkMapperTest + VariantSelectionTest.
appId: com.github.jayteealao.crumbs
---
- launchApp:
    arguments:
      debug_action: "seed"
      wipe: true
- runFlow:
    when:
      visible:
        id: "login-screen"
    commands:
      - tapOn:
          id: "login-skip-auth"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

- tapOn:
    id: "nav-tab-twitter"

# --- Narrow to VIDEO via the filter overlay ---
- tapOn:
    id: "filter-bar-cell"
- extendedWaitUntil:
    visible:
      id: "filter-overlay"
    timeout: 3000
- tapOn:
    id: "filter-overlay-chip-video"
- tapOn:
    id: "filter-overlay-apply"
- assertNotVisible:
    id: "filter-overlay"

# --- Inline player: poster + play badge present, tap plays with controls ---
- extendedWaitUntil:
    visible:
      id: "bookmark-card-video"
    timeout: 5000
- assertVisible:
    id: "bookmark-card-video-play"
- tapOn:
    id: "bookmark-card-video-play"
- extendedWaitUntil:
    visible:
      id: "bookmark-card-video-controls"
    timeout: 5000

# --- Expand to the full-screen viewer, then dismiss with Back ---
- tapOn:
    id: "bookmark-card-video-expand"
- extendedWaitUntil:
    visible:
      id: "video-viewer-screen"
    timeout: 5000
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "twitter-bookmarks-screen"
    timeout: 5000
