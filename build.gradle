// Top-level build file. All version pins live in gradle/libs.versions.toml
// (catalog) plus the plugin DSL block below; no `buildscript { ext { } }` —
// `kotlin_version` above was unused after the catalog migration in dd4a169.
plugins {
    id 'com.android.application' version '9.1.1' apply false
    id 'com.android.library' version '9.1.1' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10' apply false
    id 'com.google.devtools.ksp' version '2.2.10-2.0.2' apply false
    id 'com.google.dagger.hilt.android' version '2.59.2' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
    id 'org.jmailen.kotlinter' version '5.0.1' apply false
    id 'project-report'
}

// Enable dependency locking for all subproject configurations.
// Lock files are generated by running:
//   ./gradlew dependencies --write-locks
// Once generated, Gradle verifies every resolved artifact matches the lock file,
// preventing silent upgrades if a registry serves a different (possibly malicious)
// version of a dependency.
allprojects {
    configurations.configureEach {
        resolutionStrategy.activateDependencyLocking()
    }
}